<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joyería Alce — Catálogo</title>
<meta name="description" content="Catálogo de Joyería Alce: anillos, aretes, collares, pulseras, esclavas y tobilleras en oro 10K y plata 925.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/img/favicon.png" sizes="180x180">
<link rel="apple-touch-icon" href="assets/img/favicon.png">
<meta property="og:title" content="Joyería Alce — Catálogo">
<meta property="og:description" content="Anillos, aretes, collares, pulseras, esclavas y tobilleras en oro 10K y plata 925.">
<meta property="og:image" content="assets/img/icono-512.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="cabecera">
  <a class="marca" href="#/" aria-label="Joyería Alce, inicio">
    <img src="assets/img/logo.webp" alt="" width="38" height="39">
    <span>Joyería Alce</span>
  </a>
  <nav class="menu" id="menu" aria-label="Colecciones"></nav>
</header>

<main id="contenido">

  <!-- Inicio -->
  <section class="vista" id="vista-inicio">
    <div class="portada">
      <img class="portada__logo" src="assets/img/logo.webp" alt="Joyería Alce" width="200" height="205" fetchpriority="high">
      <h1 class="portada__titulo">Catálogo</h1>
      <p class="portada__texto">Oro 10K y plata 925. Elige una colección para ver las piezas disponibles.</p>
    </div>

    <section class="bloque">
      <h2 class="bloque__titulo">Colecciones</h2>
      <div class="colecciones" id="colecciones"></div>
    </section>

    <section class="bloque bloque--claro">
      <h2 class="bloque__titulo">Explorar por</h2>
      <div class="atajos" id="atajos"></div>
    </section>
  </section>

  <!-- Colección -->
  <section class="vista" id="vista-coleccion" hidden>
    <div class="encabezado">
      <a class="volver" href="#/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        Colecciones
      </a>
      <h1 class="encabezado__titulo" id="col-titulo"></h1>
      <p class="encabezado__conteo" id="col-conteo" role="status"></p>

      <div class="refinar" id="refinar">
        <label class="campo" id="campo-material">
          <span>Material</span>
          <select id="sel-material"></select>
        </label>
        <label class="campo" id="campo-linea">
          <span>Línea</span>
          <select id="sel-linea"></select>
        </label>
        <button type="button" class="quitar" id="quitar" hidden>Quitar filtros</button>
      </div>
    </div>

    <div class="rejilla" id="rejilla"></div>
    <p class="vacio" id="vacio" hidden>No hay piezas con esa combinación.</p>
    <div id="centinela" aria-hidden="true"></div>
  </section>

</main>

<footer class="pie">
  <img src="assets/img/logo.webp" alt="" width="56" height="57" loading="lazy">
  <p class="pie__marca">Joyería Alce</p>
  <p class="pie__nota">Oro 10K · Plata 925</p>
</footer>

<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Vista ampliada" hidden>
  <button class="visor__btn visor__btn--cerrar" id="visor-cerrar" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="visor__btn visor__btn--prev" id="visor-prev" aria-label="Anterior">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="visor__btn visor__btn--sig" id="visor-sig" aria-label="Siguiente">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <figure class="visor__marco">
    <img id="visor-img" alt="Pieza del catálogo">
  </figure>
  <p class="visor__pie"><span id="visor-etiqueta"></span><span id="visor-conteo"></span></p>
</div>

<script src="assets/js/app.js" defer></script>
</body>
</html>
